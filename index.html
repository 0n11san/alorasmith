<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alora Smith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #a82a78;
    --panel: #ee6fae;
    --blob: #f79cc7;
    --cream: #fff3d6;
    --coral: #7b4bd1;
    --purple: #4a2f8f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--page);
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    overflow-x: hidden;
  }
  .hero {
    flex: 1;
    max-width: 1120px;
    margin: 0 auto;
    background: var(--panel);
    border-radius: 36px;
    padding: clamp(24px, 5vw, 56px);
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 16px;
    align-items: center;
    box-shadow: 0 14px 0 -6px rgba(0,0,0,.18);
  }
  .blob { position: absolute; border-radius: 50%; pointer-events: none; background: var(--blob); }
  .blob.b1 { width: 620px; height: 620px; right: -140px; bottom: -260px; }
  .blob.b2 { width: 260px; height: 260px; left: -80px; top: -90px; opacity: .7; }

  h1 {
    position: relative; z-index: 2;
    font-size: clamp(4.5rem, 15vw, 10.5rem);
    line-height: 1;
    color: var(--cream);
    text-shadow: 0 6px 0 var(--coral), 0 12px 0 rgba(0,0,0,.12);
  }
  h1 span { display: block; }

  .stage { position: relative; z-index: 2; aspect-ratio: 1 / 1; width: 100%; max-width: 520px; margin-inline: auto; }
  .stage svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .char {
    position: absolute; background: none; border: 0; padding: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .char:focus-visible { outline: 4px solid var(--purple); outline-offset: 4px; }
  .char.tiger   { width: 46%; right: 0;  bottom: 0;  animation: bob 2.6s ease-in-out -1s infinite; }
  .char.ballerina { width: 58%; left: 14%; top: -8%; animation: floaty 4s ease-in-out infinite; }
  .char.cupcake { width: 28%; left: 2%;  bottom: 10%; animation: bob 3.6s ease-in-out -2s infinite; }
  .char.pop svg { animation: pop .6s ease; }
  .char.ballerina.spin svg { animation: twirl 1.1s ease-in-out; }

  .stage svg.note { position: absolute; height: auto; width: 8%; color: var(--cream); animation: rise 3.4s ease-in-out infinite; pointer-events: none; }
  .stage svg.note.n1 { left: 6%; top: 14%; }
  .stage svg.note.n2 { right: 4%; top: 22%; width: 10%; animation-delay: -1.2s; }
  .stage svg.note.n3 { left: 12%; top: 46%; width: 9%; animation-delay: -2.2s; }
  .stage svg.sparkle { position: absolute; height: auto; aspect-ratio: 1; width: 9%; color: #fff; animation: twinkle 2.4s ease-in-out infinite; pointer-events: none; }
  .stage svg.sparkle.s1 { left: 58%; top: 4%; }
  .stage svg.sparkle.s2 { right: 22%; top: 40%; width: 7%; animation-delay: -.8s; }
  .stage svg.sparkle.s3 { left: 18%; top: 52%; width: 6%; animation-delay: -1.5s; }
  .stage svg.sparkle.s4 { right: 34%; bottom: 3%; width: 5%; animation-delay: -.4s; }

  @keyframes bob     { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-3%) rotate(1.5deg); } }
  @keyframes floaty  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6%) rotate(3deg); } }
  @keyframes twinkle { 0%,100% { transform: scale(.6) rotate(0); opacity: .5; } 50% { transform: scale(1.1) rotate(20deg); opacity: 1; } }
  @keyframes pop     { 0% { transform: scale(1); } 30% { transform: scale(1.18) rotate(-6deg); } 60% { transform: scale(.94) rotate(4deg); } 100% { transform: scale(1); } }
  @keyframes twirl   { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(540deg) scale(1.15); } 100% { transform: rotateY(1080deg) scale(1); } }
  @keyframes rise    { 0%,100% { transform: translateY(0) rotate(-6deg); opacity: .75; } 50% { transform: translateY(-14%) rotate(6deg); opacity: 1; } }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; text-align: center; }
    .stage { max-width: 380px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- four-point sparkle -->
    <symbol id="sparkle" viewBox="0 0 20 20">
      <path fill="currentColor" d="M10 0 Q11.2 8.8 20 10 Q11.2 11.2 10 20 Q8.8 11.2 0 10 Q8.8 8.8 10 0Z"/>
    </symbol>

    <!-- music notes -->
    <symbol id="note1" viewBox="0 0 24 30">
      <ellipse cx="8" cy="24" rx="6.5" ry="4.8" transform="rotate(-20 8 24)" fill="currentColor"/>
      <rect x="12.5" y="3" width="2.8" height="21" rx="1.4" fill="currentColor"/>
      <path d="M14 3 Q23 8 21 17 Q18 11 14 11 Z" fill="currentColor"/>
    </symbol>
    <symbol id="note2" viewBox="0 0 36 30">
      <ellipse cx="8" cy="24" rx="6.5" ry="4.8" transform="rotate(-20 8 24)" fill="currentColor"/>
      <ellipse cx="28" cy="21" rx="6.5" ry="4.8" transform="rotate(-20 28 21)" fill="currentColor"/>
      <rect x="12.5" y="5" width="2.8" height="19" rx="1.4" fill="currentColor"/>
      <rect x="32.5" y="2" width="2.8" height="19" rx="1.4" fill="currentColor"/>
      <path d="M12.5 4 L35.3 0.5 L35.3 7 L12.5 10.5 Z" fill="currentColor"/>
    </symbol>

    

    <!-- DERPY THE TIGER in a white cowboy hat -->
    <symbol id="tiger" viewBox="0 0 200 200">
      <!-- tail -->
      <path d="M140 176 C186 176 190 130 174 118" stroke="#5fa8e8" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path d="M170 150 l14 -6 M176 132 l12 -6" stroke="#2f6fb8" stroke-width="5" stroke-linecap="round"/>
      <!-- feet -->
      <ellipse cx="72" cy="192" rx="20" ry="9" fill="#5fa8e8"/><ellipse cx="128" cy="192" rx="20" ry="9" fill="#5fa8e8"/>
      <!-- body -->
      <ellipse cx="100" cy="166" rx="46" ry="32" fill="#5fa8e8"/>
      <ellipse cx="100" cy="172" rx="26" ry="24" fill="#e8f4ff"/>
      <path d="M58 156 l12 4 M56 172 l12 2 M142 156 l-12 4 M144 172 l-12 2" stroke="#2f6fb8" stroke-width="5" stroke-linecap="round"/>
      <!-- ears -->
      <circle cx="44" cy="90" r="17" fill="#5fa8e8"/><circle cx="156" cy="90" r="17" fill="#5fa8e8"/>
      <circle cx="44" cy="92" r="9" fill="#ffb3c7"/><circle cx="156" cy="92" r="9" fill="#ffb3c7"/>
      <!-- head -->
      <ellipse cx="100" cy="118" rx="60" ry="44" fill="#5fa8e8"/>
      <path d="M42 108 l14 4 M42 122 l14 -2 M158 108 l-14 4 M158 122 l-14 -2" stroke="#2f6fb8" stroke-width="5" stroke-linecap="round"/>
      <path d="M100 74 l0 14 M84 76 l4 12 M116 76 l-4 12" stroke="#2f6fb8" stroke-width="5" stroke-linecap="round"/>
      <!-- muzzle -->
      <ellipse cx="100" cy="134" rx="30" ry="21" fill="#f4faff"/>
      <!-- derpy eyes -->
      <circle cx="72" cy="110" r="17" fill="#fff"/><circle cx="130" cy="112" r="13" fill="#fff"/>
      <circle cx="79" cy="113" r="8" fill="#2a2140"/><circle cx="123" cy="115" r="6.5" fill="#2a2140"/>
      <circle cx="81.5" cy="110" r="2.8" fill="#fff"/><circle cx="124.5" cy="112.5" r="2.2" fill="#fff"/>
      <!-- nose + goofy mouth with tongue -->
      <path d="M92 124 Q100 121 108 124 Q104 132 100 132 Q96 132 92 124 Z" fill="#ff7a9a"/>
      <path d="M84 138 Q100 152 116 138" stroke="#2a2140" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M100 132 L100 142" stroke="#2a2140" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M99 146 Q98 162 110 160 Q118 156 114 146 Q108 150 99 146 Z" fill="#ff5f86"/>
      <path d="M107 148 L107 156" stroke="#d83a66" stroke-width="2" stroke-linecap="round"/>
      <circle cx="58" cy="132" r="6" fill="#ff9a9a" opacity=".55"/><circle cx="142" cy="132" r="6" fill="#ff9a9a" opacity=".55"/>
      <!-- white cowboy hat -->
      <path d="M64 84 C62 44 66 26 82 22 C92 30 108 30 118 22 C134 26 138 44 136 84 Z" fill="#fffdf6" stroke="#e6dcc6" stroke-width="2"/>
      <path d="M80 26 Q100 44 120 26" stroke="#e6dcc6" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M64 70 Q100 82 136 70 L136 80 Q100 92 64 80 Z" fill="#c98a4b"/>
      <circle cx="100" cy="80" r="4" fill="#ffd23f"/>
      <path d="M26 88 C18 74 40 74 64 80 Q100 92 136 80 C160 74 182 74 174 88 C166 100 130 100 100 100 C70 100 34 100 26 88 Z" fill="#fffdf6" stroke="#e6dcc6" stroke-width="2"/>
    </symbol>

    

    <!-- BALLERINA -->
    <symbol id="ballerina" viewBox="0 0 200 200">
      <ellipse cx="100" cy="194" rx="46" ry="5" fill="#000" opacity=".12"/>
      <!-- far arm (extended low) -->
      <path d="M94 74 C74 76 54 84 34 98" stroke="#b97d52" stroke-width="8" fill="none" stroke-linecap="round"/>
      <!-- standing leg on pointe -->
      <path d="M98 128 C97 148 96 166 96 182" stroke="#d29a70" stroke-width="12" fill="none" stroke-linecap="round"/>
      <path d="M90 176 L102 176 L98 197 Q95 198 92 196 Z" fill="#ffd9e6" stroke="#e08fb0" stroke-width="2" stroke-linejoin="round"/>
      <path d="M90 166 L102 176 M102 166 L90 176" stroke="#e08fb0" stroke-width="2" stroke-linecap="round"/>
      <!-- torso / bodice -->
      <path d="M86 112 C84 96 86 80 90 68 Q100 62 112 68 C116 80 116 96 114 112 Z" fill="#a855f7"/>
      <path d="M90 68 Q101 78 112 68" stroke="#fff3d6" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- tutu -->
      <path d="M86 108 C60 112 38 122 30 138 C60 150 140 150 170 138 C162 122 140 112 114 108 Z" fill="#ffe3ec" stroke="#e9a9c0" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M92 112 L56 142 M98 112 L80 146 M104 112 L104 147 M110 112 L128 146 M116 112 L152 142" stroke="#f0b4c9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M30 138 C60 150 140 150 170 138 C168 146 140 156 100 156 C60 156 32 146 30 138 Z" fill="#ffd0df"/>
      <!-- working leg lifted (attitude) -->
      <path d="M150 130 C162 126 172 122 178 112" stroke="#d29a70" stroke-width="11" fill="none" stroke-linecap="round"/>
      <path d="M178 114 C170 132 150 146 128 154" stroke="#d29a70" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M122 150 L134 158 L118 168 Q112 166 114 160 Z" fill="#ffd9e6" stroke="#e08fb0" stroke-width="2" stroke-linejoin="round"/>
      <!-- near arm reaching up -->
      <path d="M108 72 C126 62 140 44 154 24" stroke="#d29a70" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="155" cy="22" r="5" fill="#d29a70"/>
      <circle cx="35" cy="99" r="5" fill="#b97d52"/>
      <!-- neck + head -->
      <path d="M96 66 L102 54 L108 60 L106 70 Z" fill="#d29a70"/>
      <circle cx="102" cy="46" r="15" fill="#d29a70"/>
      <circle cx="90" cy="30" r="11" fill="#2a1810"/>
      <path d="M88 46 C88 28 118 28 116 46 C112 38 98 36 88 46 Z" fill="#2a1810"/>
      <path d="M80 34 Q90 44 100 34" stroke="#ff8fb5" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="109" cy="48" r="2.5" fill="#2a1810"/><circle cx="109.8" cy="47.2" r="0.9" fill="#fff"/>
      <path d="M106 55 Q110 59 114 54" stroke="#7a3a1e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <circle cx="107" cy="55" r="3.5" fill="#e0806a" opacity=".5"/>
    </symbol>

    <!-- CUPCAKE -->
    <symbol id="cupcake" viewBox="0 0 200 200">
      <!-- wrapper -->
      <path d="M46 100 L154 100 L138 188 Q100 196 62 188 Z" fill="#8ec9f2"/>
      <path d="M70 100 L76 190 M100 100 L100 194 M130 100 L124 190" stroke="#62a8dc" stroke-width="5" stroke-linecap="round"/>
      <rect x="42" y="94" width="116" height="14" rx="7" fill="#a9d8f6"/>
      <!-- frosting -->
      <path d="M44 96 C34 74 54 62 70 66 C66 46 86 34 100 38 C114 34 134 46 130 66 C146 62 166 74 156 96 Z" fill="#ffe1ee"/>
      <path d="M56 88 Q100 76 144 88" stroke="#ffc0da" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M72 68 Q100 58 128 68" stroke="#ffc0da" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- cherry -->
      <path d="M100 38 Q104 22 118 16" stroke="#4a8f3f" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="100" cy="38" r="11" fill="#e0243b"/><circle cx="96.5" cy="34.5" r="3.2" fill="#fff" opacity=".7"/>
      <!-- sprinkles -->
      <g stroke-width="5" stroke-linecap="round">
        <path d="M66 82 l6 -3" stroke="#a855f7"/><path d="M118 76 l6 3" stroke="#f2604f"/>
        <path d="M92 78 l3 6" stroke="#ffd23f"/><path d="M134 88 l-5 3" stroke="#2b86c5"/>
        <path d="M80 66 l5 2" stroke="#4a8f3f"/><path d="M108 66 l6 -2" stroke="#a855f7"/>
      </g>
    </symbol>
  </defs>
</svg>

<main class="hero">
  <div class="blob b1"></div><div class="blob b2"></div>

  <h1><span>Alora</span><span>Smith</span></h1>

  <div class="stage">
    <svg class="sparkle s1" viewBox="0 0 20 20" aria-hidden="true"><use href="#sparkle"/></svg>
    <svg class="sparkle s2" viewBox="0 0 20 20" aria-hidden="true"><use href="#sparkle"/></svg>
    <svg class="sparkle s3" viewBox="0 0 20 20" aria-hidden="true"><use href="#sparkle"/></svg>
    <svg class="note n1" viewBox="0 0 24 30" aria-hidden="true"><use href="#note1"/></svg>
    <svg class="note n2" viewBox="0 0 36 30" aria-hidden="true"><use href="#note2"/></svg>
    <svg class="note n3" viewBox="0 0 24 30" aria-hidden="true"><use href="#note1"/></svg>

    <button class="char ballerina" aria-label="Ballerina, tap to twirl"><svg viewBox="0 0 200 200"><use href="#ballerina"/></svg></button>
    <button class="char cupcake" aria-label="Cupcake"><svg viewBox="0 0 200 200"><use href="#cupcake"/></svg></button>
    <button class="char tiger"   aria-label="Derpy the tiger in a white cowboy hat"><svg viewBox="0 0 200 200"><use href="#tiger"/></svg></button>
  </div>
</main>

<script>
  const timed = { ballerina: "spin" };
  document.querySelectorAll(".char").forEach(btn => {
    btn.addEventListener("click", () => {
      for (const [name, cls] of Object.entries(timed)) {
        if (btn.classList.contains(name)) {
          if (btn.classList.contains(cls)) return;
          btn.classList.add(cls);
          setTimeout(() => btn.classList.remove(cls), 1200);
          return;
        }
      }
      btn.classList.remove("pop");
      void btn.offsetWidth;
      btn.classList.add("pop");
    });
  });
</script>
</body>
</html>
